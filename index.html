<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1c1814" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="format-detection" content="telephone=no" />
  <title>OnPad</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/app.css?v=13" />
</head>
<body>
  <div id="app">
    <div id="map" role="application" aria-label="Jobsite satellite map"></div>

    <header id="topbar">
      <button type="button" id="roleBtn" class="identity role-dozer" aria-label="Profile and machine role">
        <span id="roleIcon" class="identity-icon" aria-hidden="true"></span>
        <span class="identity-copy">
          <span class="identity-kicker">I'M THE</span>
          <span id="roleLabel" class="identity-role">Dozer</span>
          <span class="identity-sub">OPERATOR</span>
        </span>
      </button>
      <div class="identity-meta">
        <span id="gpsBadge" class="badge gps-off" title="GPS">GPS</span>
        <span id="syncBadge" class="badge sync-local" title="Sync">SOLO</span>
      </div>
    </header>

    <!-- LEFT: equipment / machine actions -->
    <aside id="leftRail" class="rail rail-left" aria-label="Machine tools">
      <div class="rail-panel">
        <div class="rail-section" aria-label="Place machine">
          <span class="rail-label">Machine</span>
          <button type="button" class="tool tool-machine" data-tool="place-dozer" aria-label="Put a dozer on the map">
            <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="16" width="28" height="12" rx="2" fill="currentColor"/><rect x="4" y="24" width="14" height="6" fill="currentColor"/><circle cx="16" cy="36" r="5" fill="#1c1814" stroke="currentColor" stroke-width="3"/><circle cx="34" cy="36" r="5" fill="#1c1814" stroke="currentColor" stroke-width="3"/></svg>
            <span>Dozer</span>
          </button>
          <button type="button" class="tool tool-machine" data-tool="place-excavator" aria-label="Put an excavator on the map">
            <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="18" width="20" height="10" rx="2" fill="currentColor"/><path d="M30 20l14-8-3 10-8 4" fill="currentColor"/><circle cx="18" cy="36" r="5" fill="#1c1814" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="36" r="4" fill="#1c1814" stroke="currentColor" stroke-width="3"/></svg>
            <span>Excv</span>
          </button>
          <button type="button" class="tool tool-machine" data-tool="place-water" aria-label="Put a water truck on the map">
            <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="4" y="16" width="14" height="10" rx="2" fill="currentColor"/><ellipse cx="30" cy="22" rx="12" ry="8" fill="currentColor"/><circle cx="12" cy="36" r="5" fill="#1c1814" stroke="currentColor" stroke-width="3"/><circle cx="32" cy="36" r="5" fill="#1c1814" stroke="currentColor" stroke-width="3"/></svg>
            <span>Water</span>
          </button>
        </div>
        <div class="rail-section" id="callRow" aria-label="Calls">
          <span class="rail-label">Call</span>
          <button type="button" class="tool tool-water" data-tool="water-light" aria-label="Light spray">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M18 20c0-6 6-14 6-14s6 8 6 14a6 6 0 1 1-12 0z" fill="currentColor"/>
              <circle cx="12" cy="36" r="3" fill="currentColor" opacity=".7"/>
              <circle cx="24" cy="40" r="2.4" fill="currentColor" opacity=".55"/>
              <circle cx="36" cy="36" r="3" fill="currentColor" opacity=".7"/>
            </svg>
            <span>Light</span>
          </button>
          <button type="button" class="tool tool-water-heavy" data-tool="water-heavy" aria-label="Heavy water">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M24 6s14 16 14 24a14 14 0 1 1-28 0C10 22 24 6 24 6z" fill="currentColor"/>
            </svg>
            <span>Heavy</span>
          </button>
          <button type="button" class="tool tool-cleanup" data-tool="cleanup" aria-label="Cleanup">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M6 30h36l-4 8H10z" fill="currentColor"/>
              <path d="M10 28l4-12h20l4 12" fill="none" stroke="currentColor" stroke-width="4"/>
            </svg>
            <span>Clean</span>
          </button>
        </div>
        <div class="rail-section" id="stakeRow" aria-label="Stakeout">
          <span class="rail-label">Stake</span>
          <button type="button" class="tool tool-pin" id="pinBtn" data-tool="corner-pin" aria-label="Drop corner pin at GPS">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M24 4c-8 0-14 6-14 14 0 10 14 26 14 26s14-16 14-26c0-8-6-14-14-14z" fill="currentColor"/>
              <circle cx="24" cy="18" r="5" fill="#1c1814"/>
            </svg>
            <span>Pin</span>
            <b id="pinCount" class="count-badge">0</b>
          </button>
          <button type="button" class="tool" id="undoPinBtn" aria-label="Undo last pin">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M16 18H8l8-8M8 18c6-10 26-10 32 2" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
              <path d="M14 34h20" stroke="currentColor" stroke-width="4" stroke-linecap="round"/>
            </svg>
            <span>Undo</span>
          </button>
          <button type="button" class="tool tool-cut" id="cutBtn" aria-label="Set cut depth">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <path d="M8 14h32M8 24h32M8 34h32" stroke="currentColor" stroke-width="3" opacity=".45"/>
              <path d="M24 8v32M16 28l8 10 8-10" fill="none" stroke="currentColor" stroke-width="4" stroke-linejoin="round"/>
            </svg>
            <span>Cut</span>
          </button>
        </div>
      </div>
      <button type="button" id="leftRailHandle" class="rail-handle" aria-label="Hide or show machine tools" aria-controls="leftRail" aria-expanded="false">›</button>
    </aside>

    <!-- RIGHT: map / site surface tools -->
    <aside id="rightRail" class="rail rail-right" aria-label="Site tools">
      <button type="button" id="rightRailHandle" class="rail-handle" aria-label="Hide or show site tools" aria-controls="rightRail" aria-expanded="false">‹</button>
      <div class="rail-panel">
        <div class="rail-section" id="surfaceRow" aria-label="Surfaces">
          <span class="rail-label">Site</span>
          <button type="button" class="tool" data-tool="pad" aria-label="Pad">
            <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="8" y="14" width="32" height="20" rx="2" fill="currentColor"/></svg>
            <span>Pad</span>
          </button>
          <button type="button" class="tool" data-tool="road" aria-label="Road">
            <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="6" y="20" width="36" height="8" rx="2" transform="rotate(-18 24 24)" fill="currentColor"/></svg>
            <span>Road</span>
          </button>
          <button type="button" class="tool" data-tool="pile" aria-label="Pile">
            <svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="14" fill="none" stroke="currentColor" stroke-width="4"/><circle cx="24" cy="24" r="5" fill="currentColor"/></svg>
            <span>Pile</span>
          </button>
        </div>
        <div class="rail-section rail-map-actions" aria-label="Map controls">
          <span class="rail-label">Map</span>
          <button type="button" id="basemapBtn" class="tool tool-map" aria-label="Switch map style">
            <span class="tool-text-only">MAP</span>
          </button>
          <button type="button" id="recenterBtn" class="tool" aria-label="Recenter on machine">
            <svg viewBox="0 0 48 48" aria-hidden="true">
              <circle cx="24" cy="24" r="8" fill="none" stroke="currentColor" stroke-width="4"/>
              <path d="M24 4v8M24 36v8M4 24h8M36 24h8" stroke="currentColor" stroke-width="4" fill="none"/>
            </svg>
            <span>Here</span>
          </button>
        </div>
      </div>
    </aside>

    <div id="selectedBar" class="selected-bar" hidden>
      <div id="selectedMeta" class="selected-meta"></div>
      <div id="selectedActions" class="selected-actions"></div>
    </div>

    <!-- BOTTOM: truck / haul path tools -->
    <aside id="truckBar" class="truck-bar" aria-label="Truck path tools">
      <button type="button" id="truckBarHandle" class="truck-handle" aria-label="Hide or show truck path tools" aria-controls="truckBar" aria-expanded="false">
        <span class="truck-handle-grip" aria-hidden="true"></span>
        <span class="truck-handle-icon" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none"><rect x="4" y="16" width="12" height="12" rx="2" fill="currentColor"/><rect x="16" y="12" width="24" height="16" rx="3" fill="currentColor"/><circle cx="12" cy="34" r="5" fill="#1c1814" stroke="currentColor" stroke-width="3"/><circle cx="34" cy="34" r="5" fill="#1c1814" stroke="currentColor" stroke-width="3"/><path d="M6 10h10" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
        </span>
        <span class="truck-handle-label">TRUCK PATHS</span>
        <span id="truckHandleChevron" class="truck-handle-chevron" aria-hidden="true">▲</span>
      </button>
      <div class="truck-panel" id="truckPanel">
        <div class="truck-tools" role="toolbar" aria-label="Haul path tools">
          <button type="button" class="tool tool-truck" id="pathStartBtn" aria-label="Start haul path">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="10" cy="38" r="5" fill="currentColor"/><circle cx="38" cy="10" r="5" fill="currentColor"/><path d="M14 34 L34 14" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M28 10h10v10" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Start</span>
          </button>
          <button type="button" class="tool tool-truck" id="pathPointBtn" aria-label="Drop path point at map tap">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><circle cx="24" cy="24" r="10" fill="none" stroke="currentColor" stroke-width="5"/><circle cx="24" cy="24" r="4" fill="currentColor"/><path d="M24 4v8M24 36v8M4 24h8M36 24h8" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>
            <span>Point</span>
          </button>
          <button type="button" class="tool tool-truck" id="pathDoneBtn" aria-label="Finish path">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M8 26l10 10 22-24" fill="none" stroke="currentColor" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            <span>Done</span>
          </button>
          <button type="button" class="tool tool-truck" id="pathUndoBtn" aria-label="Undo last path point">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M14 16H6l8-10" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 16c8-12 32-12 36 4" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/></svg>
            <span>Undo</span>
          </button>
          <button type="button" class="tool tool-truck" id="pathClearBtn" aria-label="Clear paths">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M12 12l24 24M36 12L12 36" stroke="currentColor" stroke-width="6" stroke-linecap="round"/></svg>
            <span>Clear</span>
          </button>
          <button type="button" class="tool tool-truck tool-path-tag" id="pathInBtn" data-path-tag="in" aria-label="Tag path as road in">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 6v28" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M12 22l12 14 12-14" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 40h32" stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity=".5"/></svg>
            <span>In</span>
          </button>
          <button type="button" class="tool tool-truck tool-path-tag" id="pathOutBtn" data-path-tag="out" aria-label="Tag path as road out">
            <svg viewBox="0 0 48 48" fill="none" aria-hidden="true"><path d="M24 42V14" stroke="currentColor" stroke-width="5" stroke-linecap="round"/><path d="M12 26l12-14 12 14" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M8 8h32" stroke="currentColor" stroke-width="4" stroke-linecap="round" opacity=".5"/></svg>
            <span>Out</span>
          </button>
        </div>
        <p id="pathHint" class="truck-hint">Start a path, tap the map to drop haul points</p>
      </div>
    </aside>

    <div id="bootError" class="boot-error" hidden></div>
    <div id="toast" class="toast" hidden></div>
  </div>

  <!-- Profile sheet — same entry as role (#roleBtn). No second nav. -->
  <div id="roleSheet" class="sheet" hidden>
    <div class="sheet-card">
      <h2>Profile</h2>
      <label class="profile-label" for="displayNameInput">Display name</label>
      <input id="displayNameInput" class="name-input" type="text" maxlength="32" autocomplete="nickname" placeholder="Optional" enterkeyhint="done" />
      <h3 class="profile-section">Default machine</h3>
      <div class="role-grid">
        <button type="button" class="role-pick role-dozer" data-role="dozer">
          <svg viewBox="0 0 64 48" aria-hidden="true"><rect x="8" y="18" width="40" height="14" rx="2" fill="currentColor"/><rect x="4" y="28" width="18" height="6" fill="currentColor"/><circle cx="18" cy="38" r="6" fill="#1c1814" stroke="currentColor" stroke-width="3"/><circle cx="42" cy="38" r="6" fill="#1c1814" stroke="currentColor" stroke-width="3"/></svg>
          <span>Dozer</span>
        </button>
        <button type="button" class="role-pick role-excavator" data-role="excavator">
          <svg viewBox="0 0 64 48" aria-hidden="true"><rect x="18" y="22" width="28" height="12" rx="2" fill="currentColor"/><path d="M44 24l16-10-4 10-8 4" fill="currentColor"/><circle cx="28" cy="38" r="6" fill="#1c1814" stroke="currentColor" stroke-width="3"/><circle cx="46" cy="38" r="5" fill="#1c1814" stroke="currentColor" stroke-width="3"/></svg>
          <span>Excavator</span>
        </button>
        <button type="button" class="role-pick role-water" data-role="water">
          <svg viewBox="0 0 64 48" aria-hidden="true"><rect x="6" y="20" width="18" height="12" rx="2" fill="currentColor"/><ellipse cx="40" cy="26" rx="16" ry="10" fill="currentColor"/><circle cx="16" cy="38" r="6" fill="#1c1814" stroke="currentColor" stroke-width="3"/><circle cx="42" cy="38" r="6" fill="#1c1814" stroke="currentColor" stroke-width="3"/></svg>
          <span>Water</span>
        </button>
      </div>
      <div class="profile-stub">
        <button type="button" id="continueAsBtn" class="fat primary">Continue as truck driver</button>
        <span id="userIdChip" class="userid-chip" title="Anonymous id"></span>
      </div>
      <p class="hint profile-hint">No login. Rename keeps this same id.</p>
      <button type="button" class="sheet-close" data-close="roleSheet">Close</button>
    </div>
  </div>

  <!-- Cut sheet -->
  <div id="cutSheet" class="sheet" hidden>
    <div class="sheet-card">
      <h2>Cut</h2>
      <p class="hint" id="cutHint">How much to take off (ft)</p>
      <div class="cut-presets">
        <button type="button" class="cut-chip" data-cut="0.5">0.5</button>
        <button type="button" class="cut-chip" data-cut="1">1.0</button>
        <button type="button" class="cut-chip" data-cut="1.5">1.5</button>
        <button type="button" class="cut-chip" data-cut="2">2.0</button>
        <button type="button" class="cut-chip" data-cut="3">3.0</button>
      </div>
      <input id="cutInput" class="code-input" inputmode="decimal" placeholder="ft" />
      <div class="sheet-actions">
        <button type="button" id="cutGoBtn" class="fat primary">Set cut</button>
      </div>
      <button type="button" class="sheet-close" data-close="cutSheet">Close</button>
    </div>
  </div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="vendor/mqtt/mqtt.min.js"></script>
  <script src="js/app.js?v=13"></script>
</body>
</html>
